<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Deep Navy/Indigo Outer Ring Base -->
    <linearGradient id="da-outer-bg" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B2247" />
      <stop offset="50%" stop-color="#0F1738" />
      <stop offset="100%" stop-color="#1D1138" />
    </linearGradient>

    <!-- Luminous Aura Gradient (Cyan Top-Left -> Electric Blue -> Violet/Magenta Bottom-Right) -->
    <linearGradient id="da-aura-grad-1" x1="16" y1="20" x2="104" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2AF5D6" />
      <stop offset="35%" stop-color="#00D4FF" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#F042FF" />
    </linearGradient>

    <linearGradient id="da-aura-grad-2" x1="12" y1="75" x2="105" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#2DD4BF" />
      <stop offset="80%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Bar 1 Gradient (Left - Short) -->
    <linearGradient id="da-bar-1" x1="42" y1="67" x2="42" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="55%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Bar 2 Gradient (Middle - Medium) -->
    <linearGradient id="da-bar-2" x1="60" y1="55" x2="60" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="55%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Bar 3 Gradient (Right - Tall) -->
    <linearGradient id="da-bar-3" x1="78" y1="42" x2="78" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2AF5D6" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <!-- Soft Glow Filter for Aura Waves -->
    <filter id="da-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip Path for Inner White Circle -->
    <clipPath id="da-inner-clip">
      <circle cx="60" cy="60" r="34" />
    </clipPath>
  </defs>

  <!-- Outer Dark Navy Circle -->
  <circle cx="60" cy="60" r="56" fill="url(#da-outer-bg)" stroke="#091128" stroke-width="2.5" />

  <!-- Glowing Aura Swirl Rings -->
  <g filter="url(#da-glow)">
    <circle cx="60" cy="60" r="44" stroke="url(#da-aura-grad-1)" stroke-width="4.5" opacity="0.95" />
    <ellipse cx="60" cy="60" rx="46.5" ry="42.5" transform="rotate(-28 60 60)" stroke="url(#da-aura-grad-2)" stroke-width="2.4" opacity="0.85" />
    <ellipse cx="60" cy="60" rx="42.5" ry="46" transform="rotate(32 60 60)" stroke="url(#da-aura-grad-1)" stroke-width="2" opacity="0.8" />
  </g>

  <!-- Crisp Highlight Arcs on Aura -->
  <path d="M 23 40 A 43 43 0 0 1 78 20" stroke="#72FACA" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
  <path d="M 97 42 A 44 44 0 0 1 68 103" stroke="#F472B6" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />

  <!-- Inner White Circle -->
  <circle cx="60" cy="60" r="34" fill="#FFFFFF" />

  <!-- 3 Ascending Demand Bars Clipped to Inner Circle -->
  <g clip-path="url(#da-inner-clip)">
    <!-- Bar 1 (Left) -->
    <rect x="37" y="68" width="11" height="32" rx="1" fill="url(#da-bar-1)" stroke="#0B132B" stroke-width="2.2" />
    <!-- Bar 2 (Middle) -->
    <rect x="55" y="55" width="11" height="45" rx="1" fill="url(#da-bar-2)" stroke="#0B132B" stroke-width="2.2" />
    <!-- Bar 3 (Right) -->
    <rect x="73" y="42" width="11" height="58" rx="1" fill="url(#da-bar-3)" stroke="#0B132B" stroke-width="2.2" />
  </g>

  <!-- Inner Circle Dark Framing Ring -->
  <circle cx="60" cy="60" r="34" stroke="#0B1536" stroke-width="2.8" />
</svg>
